name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install OpenTUI cross-platform backends
        run: >-
          npm install --no-save --force --package-lock=false
          @opentui/core-darwin-x64@0.5.1
          @opentui/core-darwin-arm64@0.5.1
          @opentui/core-linux-x64@0.5.1
          @opentui/core-linux-x64-musl@0.5.1
          @opentui/core-linux-arm64@0.5.1
          @opentui/core-linux-arm64-musl@0.5.1
          @opentui/core-win32-x64@0.5.1
          @opentui/core-win32-arm64@0.5.1
      - run: bun run release:build
      - name: Compress and checksum
        run: |
          gzip -9 dist/release/likho-*
          cd dist/release
          sha256sum *.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --verify-tag

  npm:
    needs: binaries
    if: always() && (github.event_name == 'workflow_dispatch' || needs.binaries.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.19.0
      - name: Publish to npm with OIDC
        run: npm publish
